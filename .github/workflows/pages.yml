name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir -p _publish
          rsync -a --exclude _publish --exclude _build --exclude .git --exclude .github --exclude README.md --exclude indexnow.sh ./ _publish/
          test -f _publish/index.html
          test -f _publish/CNAME
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - id: deployment
        uses: actions/deploy-pages@v4
